name: Update central bank decisions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_central_bank_decisions.py'
      - 'scripts/validate_central_bank_decisions.py'
      - 'scripts/central_bank_registry.json'
      - 'schemas/central-bank-decisions.schema.json'
      - 'tests/test_central_bank_decisions.py'
      - '.github/workflows/update-central-bank-decisions.yml'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generated-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/validation.txt

      - name: Validate immutable dependency pins
        run: python scripts/check_ci_pins.py

      - name: Install validation dependency
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements/validation.txt
          python -m pip check

      - name: Compile guard + unit tests
        run: |
          python -m py_compile scripts/update_central_bank_decisions.py scripts/validate_central_bank_decisions.py tests/test_central_bank_decisions.py
          python -m unittest tests/test_central_bank_decisions.py -v

      - name: Collect central bank decisions
        run: python scripts/update_central_bank_decisions.py

      - name: Validate
        run: python scripts/validate_central_bank_decisions.py

      - name: Commit validated central bank decisions
        run: |
          if git diff --quiet -- site/data/central-bank-decisions.json; then
            echo 'No central-bank-decision changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/central-bank-decisions.json
          git commit -m 'Refresh central bank decisions'
          git pull --rebase origin main
          python scripts/validate_central_bank_decisions.py
          git push origin HEAD:main

  deploy:
    needs: update
    if: ${{ needs.update.result == 'success' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: main
