name: Smoke live endpoints

# Early-warning that a fragile external endpoint (ASX Markit, RBA RSS, USDA ESMIS)
# has structurally changed or died. Deliberately separate from the fail-open data
# pipeline: it never blocks a deploy, it just fails loudly (red run + notification)
# so a dead endpoint can't rot silently the way the retired ASX API did for months.
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-live-endpoints
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Smoke live source endpoints (stdlib only)
        run: python scripts/smoke_live_endpoints.py
