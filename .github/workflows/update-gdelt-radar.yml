name: Update GDELT Discovery Radar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-gdelt-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          show-progress: false

      - name: Use Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Collect public GDELT discovery metadata
        run: python scripts/update_gdelt_radar.py

      - name: Validate discovery payload
        run: python scripts/validate_gdelt_radar.py

      - name: Tag news impacts (AI, fail-open)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/tag_impacts.py

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- site/data/gdelt-radar.json site/data/impact-tags.json; then
            echo "No GDELT radar or impact-tag changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/gdelt-radar.json site/data/impact-tags.json
          git commit -m "Refresh GDELT discovery radar + impact tags"
          git push

  deploy:
    needs: refresh
    if: ${{ needs.refresh.result == 'success' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: main
